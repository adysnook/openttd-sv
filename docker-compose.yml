services:
  openttd-server:
    image: ghcr.io/ropenttd/openttd:latest
    container_name: openttd-server
    ports:
      - "3979:3979/tcp"
      - "3979:3979/udp"
    volumes:
      - ./openttd-cfg:/config
    restart: unless-stopped

  openttd-bot:
    build: 
      context: ./bot
    container_name: openttd-bot
    depends_on:
      - openttd-server
    restart: unless-stopped